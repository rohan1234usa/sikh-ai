# Every check here runs offline, with no API keys and no spend:
#   - the route tests use the local Gemini mock;
#   - the Gurbani tests replay recorded fixtures;
#   - the phrasebook test fails if its pre-generated results are stale.
# The chat and translate evals cost money, so they stay manual.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request replaces its run; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A placeholder key and an address nothing listens on, so no request
      # can reach Gemini (the tests point the routes at their own mock).
      GEMINI_API_KEY: x
      GOOGLE_GEMINI_BASE_URL: http://127.0.0.1:9
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      # Exits 1 on a placeholder mismatch between languages. It also rewrites
      # the committed report, so a string change without a report update
      # fails here.
      - name: i18n audit (dry run)
        run: |
          npm run audit:i18n -- --dry-run
          git diff --exit-code scripts/i18n-audit/report.md

      - name: Build
        run: npm run build
        env:
          # lib/firebase.ts starts Auth on import, which needs a config;
          # nothing in the build talks to Firebase.
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:0:web:0"

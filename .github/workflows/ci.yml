# Every check here runs offline, with no API keys and no spend:
#   - the route tests use the local Gemini mock;
#   - the Gurbani tests replay recorded fixtures;
#   - the phrasebook test fails if its pre-generated results are stale.
# The chat and translate evals cost money, so they stay manual.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request replaces its run; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A ruleset on main requires a passing check with this job's name. If the
  # job is renamed or split, change the ruleset too, or every pull request
  # waits for a check that never reports.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A placeholder key and an address nothing listens on, so no request
      # can reach Gemini (the tests point the routes at their own mock).
      GEMINI_API_KEY: x
      GOOGLE_GEMINI_BASE_URL: http://127.0.0.1:9
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      # The Firestore rules, on the Firestore emulator (tests/rules). It runs
      # on Java, and firebase-tools downloads it once per version: keep the
      # cache key in step with the version in package.json's test:rules.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.32.0

      - name: Firestore rules
        run: npm run test:rules

      # Exits 1 on a placeholder mismatch between languages. It also rewrites
      # the committed report, so a string change without a report update
      # fails here.
      - name: i18n audit (dry run)
        run: |
          npm run audit:i18n -- --dry-run
          git diff --exit-code scripts/i18n-audit/report.md

      - name: Build
        run: npm run build
        env:
          # The Firebase modules (lib/firebase/) start on import on the pages
          # that use them, which needs a config; nothing in the build talks
          # to Firebase.
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:0:web:0"

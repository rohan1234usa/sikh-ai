# Weekly, grouped update PRs. next, react and react-dom are pinned to exact
# versions, so without these, patch and security releases only arrive when
# someone bumps them by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A package joins the first group it matches.
    groups:
      # Released together, and eslint-config-next must match next.
      nextjs:
        patterns: ["next", "eslint-config-next", "@next/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Node is pinned to 24 (.nvmrc and engines), and its types follow it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Lint fails on TypeScript 7 and ESLint 10 (#27, #28) until the plugins
      # catch up: typescript-eslint 8.71 supports TypeScript below 6.1, and
      # eslint-plugin-react 7.37, which eslint-config-next uses, ESLint up to
      # 9. Drop each rule once its plugin supports the new major.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
